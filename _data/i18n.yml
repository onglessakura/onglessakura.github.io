  faq:
    - q: Where is Ongles Sakura Spa located?
      a: At 300 Sherbrooke Street West, a few minutes' walk from Place-des-Arts metro in downtown Montréal.
    - q: How do I book an appointment?
      a: Book online anytime through our booking system, or call us at 438-936-8898.
    - q: Do you have a student offer?
      a: Yes! Enjoy our student happy hours from 10 am to 12 pm. Please bring a valid student card.
    - q: What services do you offer?
      a: Manicures, pedicures, nail extensions, eyelash extensions, head spa, waxing and threading, foot massage and personalized services.
