  faq:
    - q: Où se trouve Ongles Sakura Spa ?
      a: Au 300, rue Sherbrooke Ouest, à quelques minutes à pied du métro Place-des-Arts, au centre-ville de Montréal.
    - q: Comment prendre rendez-vous ?
      a: Réservez en ligne en tout temps grâce à notre système de réservation, ou appelez-nous au 438 936-8898.
    - q: Avez-vous une offre pour les étudiants ?
      a: Oui ! Profitez de nos happy hours étudiants de 10 h à 12 h. Présentez votre carte étudiante valide lors de votre visite.
    - q: Quels services offrez-vous ?
      a: Manucure, pédicure, extensions d'ongles, extensions de cils, head spa, épilation à la cire et au fil, massage des pieds et services personnalisés.
