# ─────────────────────────────────────────────────────────────
#  Ongles Sakura Spa — site settings
#  Most day-to-day edits happen here and in _data/*.yml
# ─────────────────────────────────────────────────────────────

title: Ongles Sakura Spa
tagline: Salon d'ongles & spa au centre-ville de Montréal
description: >-
  Salon d'ongles et spa beauté près du métro Place-des-Arts à Montréal :
  manucure, pédicure, extensions d'ongles, cils, épilation, head spa et
  épilation au fil. Espace propre, calme et hygiénique. Réservez en ligne.
url: "https://onglessakura.com"
baseurl: ""
lang: fr_CA
timezone: America/Toronto
logo: /assets/img/logo.png
image: /assets/img/og-image.jpg

# ── Business info (used in header, footer, contact, and Google schema) ──
business:
  name: Ongles Sakura Spa
  phone: "+1-438-936-8898"
  phone_display: "438 936-8898"
  email: onglessakuraspa@gmail.com
  street: 300 Rue Sherbrooke Ouest
  city: Montréal
  region: QC
  postal: H2X 1X9
  country: CA
  metro: Place-des-Arts
  booking_url: https://onglessakura.setmore.com
  # Setmore page embedded in the "Réservation" section (leave "" to hide the section)
  booking_embed_url: ""      # was https://onglessakura.setmore.com/#reviews (embed removed for speed)
  instagram: https://www.instagram.com/onglessakura
  # Paste your Google Maps share link and "Get more reviews" link here:
  google_maps_url: https://maps.google.com/?cid=18003722729717811053   # your Google Business Profile
  google_review_url: ""      # e.g. https://g.page/r/XXXXXXXX/review
  price_range: "$$"
  # Review scores shown on the site — update them every month or two.
  ratings:
    google:  { score: "5.0", count: 186, url: "https://maps.google.com/?cid=18003722729717811053" }
    setmore: { score: "4.9", count: 247, url: "https://onglessakura.setmore.com/#reviews" }
  # Attributes listed on the Google Business Profile
  women_owned: true
  lgbtq_friendly: true
  storefront_photo: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9StKtu_IB0Z6jkc3E-fNKSr5wHRiXstuFv7MklQAyR2bLQcmUYYRj6nN5-pQqsmtZ6uBqt01e-uDbJ_1ie8q-jsc7cXNMTOoH7Sgzb25xOHyhhdNiMyiG6sZpEANuxyy6aIQgRvTAH5nZI"
  # Opening hours — same as the Google Business Profile (checked Nov 2026).
  # Used on the page, in the "open now" badge and in Google's structured data.
  # If you change them here, change them on Google too (and vice-versa).
  hours:
    - days: [Monday, Tuesday, Wednesday]
      fr: Lundi – Mercredi
      en: Monday – Wednesday
      fr_short: Lun – Mer
      en_short: Mon – Wed
      opens: "10:00"
      closes: "19:00"
    - days: [Thursday, Friday]
      fr: Jeudi – Vendredi
      en: Thursday – Friday
      fr_short: Jeu – Ven
      en_short: Thu – Fri
      opens: "10:00"
      closes: "20:00"
    - days: [Saturday, Sunday]
      fr: Samedi – Dimanche
      en: Saturday – Sunday
      fr_short: Sam – Dim
      en_short: Sat – Sun
      opens: "10:00"
      closes: "18:00"
  geo: { lat: 45.5087058, lng: -73.5708915 }

# ── Google Analytics 4 / Search Console (paste IDs when you have them) ──
google_analytics: ""          # e.g. G-XXXXXXXXXX
# webmaster_verifications:     # uncomment + paste Search Console code
#   google: "xxxxxxxx"

# ── Optional announcement bar (leave text empty to hide) ──
#    e.g. holidays:  fr: "🎉 Bonne année ! Fermé le 1er janvier"
announcement:
  fr: "Offre étudiants · Happy hours de 10 h à 12 h"
  en: "Student special · Happy hours 10 am – 12 pm"

# ── Blog ──
permalink: /blog/:year/:title/

# ── Plugins (all supported natively by GitHub Pages) ──
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /blog/feed.xml

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      lang: fr
      author: Ongles Sakura Spa

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - _preview/
