<section class="page-hero">
  <div class="container">
    <p class="eyebrow">{% include ui-icon.html name="sparkle" %}{{ t.gallery_eyebrow }}</p>
    <h1 class="h1">{{ t.gallery_title }}</h1>
    <p class="lead narrow">{{ t.gallery_lead }}</p>
  </div>
</section>
<section class="section section-flush">
  <div class="container">
    {% include gallery-grid.html filters=true %}
    <p class="center gap-top cta-row">
      <a class="btn btn-dark" href="{{ site.business.booking_url }}" target="_blank" rel="noopener" data-track="book_click">{% include ui-icon.html name="calendar" %}{{ t.book_long }}</a>
      <a class="link-quiet" href="{{ site.business.instagram }}" target="_blank" rel="noopener">{{ t.instagram_follow }}</a>
    </p>
  </div>
</section>
